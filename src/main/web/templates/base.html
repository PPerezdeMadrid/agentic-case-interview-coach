<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} AI Consulting Interview dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='20260713a') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ url_for('index') }}">AI Consulting Interview Dashboard</a>
        <nav class="nav">
          <a href="{{ url_for('index') }}">Runs</a>
          <a href="{{ url_for('experiment_index') }}">Experiment</a>
          <a href="{{ url_for('rag_evaluation_index') }}">RAG Evaluation</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <section class="flash-stack">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </section>
      {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
