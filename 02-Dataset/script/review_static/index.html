<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Case JSON Review</title>
    <style>
      :root {
        --paper: #f4efe4;
        --ink: #17222f;
        --ink-2: #24384b;
        --muted: #5f6c7b;
        --line: #d4c8ad;
        --panel: rgba(255, 252, 246, 0.92);
        --panel-strong: rgba(255, 249, 240, 0.98);
        --accent: #9b2c17;
        --accent-2: #7f2311;
        --accent-soft: #f6d1c6;
        --ok: #1f6d57;
        --shadow: 0 20px 45px rgba(23, 34, 47, 0.12);
        --shadow-tight: 0 8px 22px rgba(23, 34, 47, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(155, 44, 23, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(31, 109, 87, 0.12), transparent 26%),
          linear-gradient(180deg, #fbf7ef 0%, #efe6d7 100%);
        min-height: 100vh;
      }

      .shell {
        padding: 20px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1.4fr 1.4fr 100px 100px auto;
        gap: 12px;
        align-items: end;
        background: var(--panel);
        border: 1px solid rgba(212, 200, 173, 0.8);
        box-shadow: var(--shadow);
        border-radius: 20px;
        padding: 18px;
        backdrop-filter: blur(8px);
        position: sticky;
        top: 14px;
        z-index: 2;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      select,
      input,
      button {
        font: inherit;
      }

      select,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        border: 1px solid rgba(127, 35, 17, 0.28);
        border-radius: 999px;
        padding: 12px 18px;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
        cursor: pointer;
        box-shadow: var(--shadow-tight);
        font-weight: 700;
        letter-spacing: 0.01em;
        transition:
          transform 120ms ease,
          box-shadow 160ms ease,
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 26px rgba(23, 34, 47, 0.18);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 6px 14px rgba(23, 34, 47, 0.16);
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(155, 44, 23, 0.18);
        outline-offset: 2px;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.82);
        border-color: rgba(23, 34, 47, 0.18);
        color: var(--ink);
      }

      button.secondary:hover {
        background: rgba(255, 255, 255, 0.94);
      }

      .summary {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(420px, 1.1fr) minmax(380px, 0.9fr);
        gap: 18px;
        margin-top: 18px;
        min-height: calc(100vh - 180px);
      }

      .panel {
        min-height: 70vh;
        background: var(--panel);
        border: 1px solid rgba(212, 200, 173, 0.8);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid rgba(212, 200, 173, 0.8);
        background: linear-gradient(180deg, rgba(255, 248, 238, 0.98), rgba(250, 242, 230, 0.92));
      }

      .panel-head h2 {
        margin: 0;
        font-size: 20px;
      }

      .panel-head-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .panel-body {
        height: calc(100% - 69px);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .json-wrap {
        height: 100%;
        overflow: auto;
        padding: 16px;
      }

      .json-toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 4px 0 10px;
        background: linear-gradient(180deg, rgba(255, 252, 246, 0.98), rgba(255, 252, 246, 0.78));
      }

      .json-toolbar button {
        padding: 10px 14px;
        font-size: 14px;
      }

      .json-toolbar button.ghost {
        background: rgba(23, 34, 47, 0.07);
        border-color: rgba(23, 34, 47, 0.08);
        color: var(--ink-2);
        box-shadow: none;
      }

      .json-toolbar button.active {
        background: var(--ink);
        border-color: rgba(23, 34, 47, 0.3);
        color: white;
        box-shadow: var(--shadow-tight);
      }

      .json-toolbar button#saveJsonButton {
        margin-left: auto;
        min-width: 124px;
      }

      .json-toolbar button.ghost:hover {
        background: rgba(23, 34, 47, 0.12);
      }

      .status-line {
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(212, 200, 173, 0.95);
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 14px;
      }

      .status-line.error {
        color: #8a1f1f;
        background: rgba(255, 228, 228, 0.88);
        border-color: rgba(190, 88, 88, 0.65);
      }

      .status-line.success {
        color: var(--ok);
        background: rgba(223, 245, 236, 0.88);
        border-color: rgba(95, 160, 130, 0.65);
      }

      .editor-panel,
      .review-panel {
        display: none;
      }

      .editor-panel.active,
      .review-panel.active {
        display: block;
      }

      .editor-panel {
        height: calc(100% - 70px);
      }

      .editor-area {
        width: 100%;
        min-height: 56vh;
        resize: vertical;
        border: 1px solid rgba(212, 200, 173, 0.95);
        border-radius: 18px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      .card {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(212, 200, 173, 0.95);
        border-radius: 18px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.03em;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .badge.page {
        background: rgba(23, 34, 47, 0.08);
        color: var(--ink);
        cursor: pointer;
        border: 1px solid rgba(23, 34, 47, 0.08);
        box-shadow: none;
        padding: 6px 11px;
        font-weight: 600;
      }

      .badge.page:hover {
        background: rgba(23, 34, 47, 0.13);
        color: var(--ink);
      }

      .badge.visible {
        background: rgba(31, 109, 87, 0.12);
        color: var(--ok);
      }

      .content {
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .asset-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent);
        text-decoration: none;
      }

      details {
        margin-top: 18px;
        background: rgba(255, 255, 255, 0.54);
        border: 1px solid rgba(212, 200, 173, 0.9);
        border-radius: 16px;
        padding: 10px 14px;
      }

      summary {
        cursor: pointer;
        font-weight: 600;
      }

      pre {
        margin: 12px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 13px;
      }

      .empty {
        color: var(--muted);
        padding: 40px 20px;
      }

      @media (max-width: 1100px) {
        .topbar {
          grid-template-columns: 1fr 1fr;
        }

        .actions {
          grid-column: 1 / -1;
          justify-content: flex-start;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .panel {
          min-height: 52vh;
        }
      }

      @media (max-width: 720px) {
        .shell {
          padding: 12px;
        }

        .topbar {
          grid-template-columns: 1fr;
          padding: 14px;
        }

        .json-toolbar button#saveJsonButton {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="field">
          <label for="jsonSelect">JSON</label>
          <select id="jsonSelect"></select>
        </div>
        <div class="field">
          <label for="pdfSelect">PDF</label>
          <select id="pdfSelect"></select>
        </div>
        <div class="field">
          <label for="pageInput">Page</label>
          <input id="pageInput" type="number" min="1" value="1">
        </div>
        <div class="field">
          <label for="offsetInput">Offset</label>
          <input id="offsetInput" type="number" value="0">
        </div>
        <div class="actions">
          <button id="goPageButton" type="button">Go to page</button>
          <button id="openPdfButton" class="secondary" type="button">Open PDF</button>
        </div>
      </div>

      <div id="summary" class="summary"></div>

      <div class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>Source PDF</h2>
            <span id="pdfHint" class="pill">No PDF selected</span>
          </div>
          <div class="panel-body">
            <iframe id="pdfFrame" title="PDF review panel"></iframe>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>JSON Review</h2>
            <div class="panel-head-right">
              <span id="jsonHint" class="pill">No JSON loaded</span>
              <span id="dirtyHint" class="pill">Saved</span>
            </div>
          </div>
          <div id="jsonWrap" class="json-wrap">
            <div class="json-toolbar">
              <button id="reviewModeButton" class="ghost active" type="button">Review</button>
              <button id="editModeButton" class="ghost" type="button">Edit</button>
              <button id="formatJsonButton" class="secondary" type="button">Format</button>
              <button id="validateJsonButton" class="secondary" type="button">Validate</button>
              <button id="reloadJsonButton" class="secondary" type="button">Reload</button>
              <button id="saveJsonButton" type="button">Save JSON</button>
            </div>
            <div id="statusLine" class="status-line">Pick a JSON file to inspect it next to the source PDF.</div>
            <div id="reviewPanel" class="review-panel active">
              <div class="empty">Pick a JSON file to inspect it next to the source PDF.</div>
            </div>
            <div id="editorPanel" class="editor-panel">
              <textarea id="jsonEditor" class="editor-area" spellcheck="false"></textarea>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const state = {
        files: null,
        jsonPayload: null,
      };

      const jsonSelect = document.getElementById("jsonSelect");
      const pdfSelect = document.getElementById("pdfSelect");
      const pageInput = document.getElementById("pageInput");
      const offsetInput = document.getElementById("offsetInput");
      const goPageButton = document.getElementById("goPageButton");
      const openPdfButton = document.getElementById("openPdfButton");
      const pdfFrame = document.getElementById("pdfFrame");
      const pdfHint = document.getElementById("pdfHint");
      const jsonHint = document.getElementById("jsonHint");
      const dirtyHint = document.getElementById("dirtyHint");
      const summary = document.getElementById("summary");
      const reviewModeButton = document.getElementById("reviewModeButton");
      const editModeButton = document.getElementById("editModeButton");
      const formatJsonButton = document.getElementById("formatJsonButton");
      const validateJsonButton = document.getElementById("validateJsonButton");
      const reloadJsonButton = document.getElementById("reloadJsonButton");
      const saveJsonButton = document.getElementById("saveJsonButton");
      const statusLine = document.getElementById("statusLine");
      const reviewPanel = document.getElementById("reviewPanel");
      const editorPanel = document.getElementById("editorPanel");
      const jsonEditor = document.getElementById("jsonEditor");

      function prettyJson(data) {
        return JSON.stringify(data, null, 2);
      }

      function setStatus(message, kind = "neutral") {
        statusLine.textContent = message;
        statusLine.className = "status-line";
        if (kind === "error") {
          statusLine.classList.add("error");
        }
        if (kind === "success") {
          statusLine.classList.add("success");
        }
      }

      function editorIsDirty() {
        if (!state.jsonPayload) {
          return false;
        }
        return jsonEditor.value !== prettyJson(state.jsonPayload.data);
      }

      function updateDirtyHint() {
        dirtyHint.textContent = editorIsDirty() ? "Unsaved changes" : "Saved";
      }

      function setMode(mode) {
        const reviewActive = mode === "review";
        reviewPanel.classList.toggle("active", reviewActive);
        editorPanel.classList.toggle("active", !reviewActive);
        reviewModeButton.classList.toggle("active", reviewActive);
        editModeButton.classList.toggle("active", !reviewActive);
      }

      function buildStaticUrl(relativePath) {
        return "/" + relativePath.split("/").map(encodeURIComponent).join("/");
      }

      function resolveAssetPath(baseDir, assetPath) {
        if (!assetPath) {
          return null;
        }

        if (assetPath.includes("://") || assetPath.startsWith("/")) {
          return assetPath;
        }

        const parts = baseDir.split("/").filter(Boolean);
        for (const token of assetPath.split("/")) {
          if (!token || token === ".") {
            continue;
          }
          if (token === "..") {
            parts.pop();
            continue;
          }
          parts.push(token);
        }

        return parts.join("/");
      }

      function updatePdfFrame(openInNewTab = false) {
        const pdfPath = pdfSelect.value;
        const page = Number(pageInput.value || 1);

        if (!pdfPath) {
          pdfFrame.removeAttribute("src");
          pdfHint.textContent = "No PDF selected";
          return;
        }

        const url = `${buildStaticUrl(pdfPath)}#page=${page}&zoom=page-fit`;
        pdfHint.textContent = `${pdfPath} · page ${page}`;

        if (openInNewTab) {
          window.open(url, "_blank", "noopener");
          return;
        }

        pdfFrame.src = url;
      }

      function renderSummary(payload) {
        const items = [];
        items.push(`<span class="pill">Format: ${payload.summary.format}</span>`);

        if (payload.summary.item_count !== null) {
          items.push(`<span class="pill">Items: ${payload.summary.item_count}</span>`);
        }

        if (payload.summary.min_page !== null) {
          items.push(`<span class="pill">Pages: ${payload.summary.min_page}–${payload.summary.max_page}</span>`);
        }

        items.push(`<span class="pill">File: ${payload.path}</span>`);
        summary.innerHTML = items.join("");
      }

      function jumpToSourcePage(sourcePage) {
        const offset = Number(offsetInput.value || 0);
        const targetPage = Number(sourcePage) + offset;
        pageInput.value = targetPage;
        updatePdfFrame(false);
      }

      function makePageBadge(sourcePage) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "badge page";
        button.textContent = `source_page ${sourcePage}`;
        button.addEventListener("click", () => jumpToSourcePage(sourcePage));
        return button;
      }

      function renderCards(payload) {
        const fragment = document.createDocumentFragment();
        const baseDir = payload.dir;
        const data = payload.data;

        function appendRawJsonBlock() {
          const details = document.createElement("details");
          const summaryNode = document.createElement("summary");
          summaryNode.textContent = "Raw JSON";
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(data, null, 2);
          details.append(summaryNode, pre);
          fragment.appendChild(details);
        }

        if (Array.isArray(data)) {
          data.forEach((item, index) => {
            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = `Page block ${index + 1}`;

            const meta = document.createElement("div");
            meta.className = "meta";
            if (item.block_type_guess) {
              const badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = item.block_type_guess;
              meta.appendChild(badge);
            }
            if (item.source_page !== undefined) {
              meta.appendChild(makePageBadge(item.source_page));
            }
            if (Array.isArray(item.tables) && item.tables.length) {
              const badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = `${item.tables.length} table(s)`;
              meta.appendChild(badge);
            }

            const content = document.createElement("div");
            content.className = "content";
            content.textContent = item.text || "(empty text block)";

            card.append(title, meta, content);

            const assetPath = item.page_image || item.image;
            if (assetPath) {
              const link = document.createElement("a");
              link.className = "asset-link";
              link.href = buildStaticUrl(resolveAssetPath(baseDir, assetPath));
              link.target = "_blank";
              link.rel = "noopener";
              link.textContent = "Open extracted image";
              card.appendChild(link);
            }

            fragment.appendChild(card);
          });

          appendRawJsonBlock();
          return fragment;
        }

        if (data && Array.isArray(data.case_content)) {
          data.case_content.forEach((item, index) => {
            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = item.title || item.block_id || `Block ${index + 1}`;

            const meta = document.createElement("div");
            meta.className = "meta";

            if (item.block_type) {
              const badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = item.block_type;
              meta.appendChild(badge);
            }

            if (item.visible_to_candidate !== undefined) {
              const badge = document.createElement("span");
              badge.className = "badge visible";
              badge.textContent = item.visible_to_candidate ? "candidate visible" : "interviewer only";
              meta.appendChild(badge);
            }

            if (item.source_page !== undefined) {
              meta.appendChild(makePageBadge(item.source_page));
            }

            const content = document.createElement("div");
            content.className = "content";
            content.textContent = item.content || "(empty content)";

            card.append(title, meta, content);

            if (item.image) {
              const link = document.createElement("a");
              link.className = "asset-link";
              link.href = buildStaticUrl(resolveAssetPath(baseDir, item.image));
              link.target = "_blank";
              link.rel = "noopener";
              link.textContent = "Open linked image";
              card.appendChild(link);
            }

            fragment.appendChild(card);
          });

          appendRawJsonBlock();
          return fragment;
        }

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "This JSON format is not recognized by the viewer yet.";
        fragment.appendChild(empty);
        appendRawJsonBlock();
        return fragment;
      }

      async function loadJson(path) {
        if (!path) {
          return;
        }

        if (editorIsDirty() && !window.confirm("You have unsaved changes. Discard them and load another JSON?")) {
          return false;
        }

        const response = await fetch(`/api/json?path=${encodeURIComponent(path)}`);
        const payload = await response.json();
        state.jsonPayload = payload;

        jsonHint.textContent = payload.path;
        renderSummary(payload);
        reviewPanel.innerHTML = "";
        reviewPanel.appendChild(renderCards(payload));
        jsonEditor.value = prettyJson(payload.data);
        updateDirtyHint();
        setStatus("JSON loaded. You can review it or switch to Edit mode.", "success");
        return true;
      }

      function validateEditorJson(showSuccess = true) {
        try {
          const parsed = JSON.parse(jsonEditor.value);
          if (showSuccess) {
            setStatus("Valid JSON.", "success");
          }
          return parsed;
        } catch (error) {
          setStatus(`Invalid JSON: ${error.message}`, "error");
          return null;
        }
      }

      function refreshReviewFromEditor(parsedJson) {
        if (!state.jsonPayload) {
          return;
        }

        const previewPayload = {
          ...state.jsonPayload,
          data: parsedJson,
          summary: {
            ...state.jsonPayload.summary,
            ...(() => {
              if (Array.isArray(parsedJson)) {
                const pages = parsedJson
                  .filter((item) => item && typeof item === "object" && item.source_page !== undefined)
                  .map((item) => item.source_page);
                return {
                  format: "raw_pages",
                  item_count: parsedJson.length,
                  min_page: pages.length ? Math.min(...pages) : null,
                  max_page: pages.length ? Math.max(...pages) : null,
                };
              }
              if (parsedJson && Array.isArray(parsedJson.case_content)) {
                const pages = parsedJson.case_content
                  .filter((item) => item && typeof item === "object" && item.source_page !== undefined)
                  .map((item) => item.source_page);
                return {
                  format: "structured_case",
                  item_count: parsedJson.case_content.length,
                  min_page: pages.length ? Math.min(...pages) : null,
                  max_page: pages.length ? Math.max(...pages) : null,
                };
              }
              return {
                format: "unknown",
                item_count: null,
                min_page: null,
                max_page: null,
              };
            })(),
          },
        };

        renderSummary(previewPayload);
        reviewPanel.innerHTML = "";
        reviewPanel.appendChild(renderCards(previewPayload));
      }

      async function saveEditorJson() {
        if (!state.jsonPayload) {
          return;
        }

        const parsed = validateEditorJson(false);
        if (!parsed) {
          return;
        }

        const response = await fetch("/api/json/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            path: state.jsonPayload.path,
            content: jsonEditor.value,
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          setStatus(`Save failed: ${errorText}`, "error");
          return;
        }

        const payload = await response.json();
        state.jsonPayload = payload;
        jsonEditor.value = prettyJson(payload.data);
        refreshReviewFromEditor(payload.data);
        updateDirtyHint();
        setStatus(`Saved ${payload.path}.`, "success");
      }

      function fillSelect(select, items, preferredPath = null) {
        select.innerHTML = "";
        items.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.path;
          option.textContent = item.label;
          if (preferredPath && preferredPath === item.path) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      }

      function chooseDefaultJson(jsons) {
        const preferred = jsons.find((entry) => entry.path.includes("duke_yachtco_01_clean_raw.json"));
        return preferred ? preferred.path : (jsons[0]?.path ?? "");
      }

      function chooseDefaultPdf(pdfs, preferredPath) {
        const preferred = pdfs.find((entry) => entry.path === preferredPath);
        if (preferred) {
          return preferred.path;
        }
        const duke = pdfs.find((entry) => entry.path.endsWith("Duke-Casebook-2017-Profitability-18.pdf"));
        return duke ? duke.path : (pdfs[0]?.path ?? "");
      }

      async function init() {
        const response = await fetch("/api/files");
        state.files = await response.json();

        const defaultJson = chooseDefaultJson(state.files.jsons);
        const selectedJsonMeta = state.files.jsons.find((entry) => entry.path === defaultJson);
        const defaultPdf = chooseDefaultPdf(state.files.pdfs, selectedJsonMeta?.suggested_pdf || state.files.default_pdf);

        fillSelect(jsonSelect, state.files.jsons, defaultJson);
        fillSelect(pdfSelect, state.files.pdfs, defaultPdf);

        updatePdfFrame(false);
        await loadJson(defaultJson);
      }

      jsonSelect.addEventListener("change", async () => {
        const selectedMeta = state.files.jsons.find((entry) => entry.path === jsonSelect.value);
        if (selectedMeta?.suggested_pdf) {
          const matchingPdf = state.files.pdfs.find((entry) => entry.path === selectedMeta.suggested_pdf);
          if (matchingPdf) {
            pdfSelect.value = matchingPdf.path;
          }
        }
        updatePdfFrame(false);
        const loaded = await loadJson(jsonSelect.value);
        if (!loaded && state.jsonPayload) {
          jsonSelect.value = state.jsonPayload.path;
        }
      });

      pdfSelect.addEventListener("change", () => updatePdfFrame(false));
      goPageButton.addEventListener("click", () => updatePdfFrame(false));
      openPdfButton.addEventListener("click", () => updatePdfFrame(true));
      reviewModeButton.addEventListener("click", () => setMode("review"));
      editModeButton.addEventListener("click", () => setMode("edit"));
      validateJsonButton.addEventListener("click", () => validateEditorJson(true));
      formatJsonButton.addEventListener("click", () => {
        const parsed = validateEditorJson(false);
        if (!parsed) {
          return;
        }
        jsonEditor.value = prettyJson(parsed);
        refreshReviewFromEditor(parsed);
        updateDirtyHint();
        setStatus("JSON formatted.", "success");
      });
      reloadJsonButton.addEventListener("click", async () => {
        if (editorIsDirty() && !window.confirm("Discard unsaved changes and reload from disk?")) {
          return;
        }
        await loadJson(jsonSelect.value);
      });
      saveJsonButton.addEventListener("click", async () => {
        await saveEditorJson();
      });
      pageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          updatePdfFrame(false);
        }
      });
      jsonEditor.addEventListener("input", () => {
        updateDirtyHint();
      });

      init().catch((error) => {
        setStatus(error.message, "error");
        reviewPanel.innerHTML = `<div class="empty">${error.message}</div>`;
      });
    </script>
  </body>
</html>
